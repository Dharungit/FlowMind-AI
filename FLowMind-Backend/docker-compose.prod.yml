services:
  db:
    restart: unless-stopped
    container_name: flowmind-db
    networks:
      - flowmind-network

  api:
    restart: unless-stopped
    container_name: flowmind-api
    env_file:
      - .env.prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - flowmind-network

networks:
  flowmind-network:
    driver: bridge
